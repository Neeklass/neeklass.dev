name: Checks

# Runs the same gates as the deployment on every pull request, so a change is
# verified before it reaches main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Brand rules
        run: npm run check:brand && npm run test:brand
      - name: Check and build
        # Verifies the code even while copy placeholders remain. Deployment
        # (deploy.yml) still refuses to build with placeholders.
        run: npm run build
        env:
          ALLOW_COPY_PLACEHOLDERS: '1'
      - name: Blog tests
        run: npm run test:blog
