name: Checks

# Runs the same gates as the deployment on every pull request, so a change is
# verified before it reaches main. Copy placeholders make the build fail on
# purpose: such a pull request is waiting for Niklas's text.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Brand rules
        run: npm run check:brand && npm run test:brand
      - name: Check and build
        # Copy placeholders are reported separately below, so this step
        # verifies the code itself even while copy is pending.
        run: npm run build
        env:
          ALLOW_COPY_PLACEHOLDERS: '1'
      - name: Blog tests
        run: npm run test:blog
      - name: Copy placeholders
        shell: bash
        run: |
          matches=$(grep -rn --include='*.astro' '<Placeholder' src | grep -v '^src/components/Placeholder.astro' || true)
          if [ -n "$matches" ]; then
            echo "$matches" | sed -E 's/^([^:]+):([0-9]+):.*hint=["{]([^"}]*).*/::error file=\1,line=\2::Copy missing: \3/'
            echo "Copy placeholders remain; this pull request waits for Niklas's text."
            exit 1
          fi
          echo "No copy placeholders."
