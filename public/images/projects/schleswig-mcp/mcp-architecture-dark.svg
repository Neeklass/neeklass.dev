<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1510" viewBox="0 0 1100 1510" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Schleswig MCP system architecture</title>
<desc id="diagram-desc">Web applications use the REST API and AI assistants use the MCP server. Both share application logic, data processing, and validation. Five curated open-data snapshots feed structured data; external APIs provide live information.</desc>
