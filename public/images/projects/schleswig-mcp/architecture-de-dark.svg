<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1310" viewBox="0 0 1100 1310" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Systemarchitektur von Schleswig MCP</title>
<desc id="diagram-desc">Webanwendungen nutzen die REST-API, KI-Assistenten den MCP-Server. Beide verwenden gemeinsame Anwendungslogik, Datenverarbeitung und Validierung. Fünf aufbereitete Open-Data-Snapshots liefern strukturierte Daten; eine externe API liefert den Live-Wasserstand.</desc>
